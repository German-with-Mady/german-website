<section class="lhero" data-tone="phrases"><div class="lhero-in"><h1 class="ltitle">Phrases</h1><p class="hint">German expressions and how to pronounce them. Tap any card to hear it.</p></div></section><main class="wrap" data-tone="phrases"><h2 class="sec">The basics</h2><div class="grid cols-list"><button class="tile" type="button" data-say="Guten morgen" data-rate="0.7"><span class="de" lang="de">Guten morgen</span><span class="en">good morning</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Guten Tag" data-rate="0.7"><span class="de" lang="de">Guten Tag</span><span class="en">good afternoon</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Guten Abend" data-rate="0.7"><span class="de" lang="de">Guten Abend</span><span class="en">good evening</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Gute Nacht" data-rate="0.7"><span class="de" lang="de">Gute Nacht</span><span class="en">good Night</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Tschüss" data-rate="0.7"><span class="de" lang="de">Tschüss</span><span class="en">Bye ; in formal</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="AufWiedersehen" data-rate="0.7"><span class="de" lang="de">AufWiedersehen</span><span class="en">Goodbye ; formal</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Wie heißt du" data-rate="0.7"><span class="de" lang="de">Wie heißt du ?</span><span class="en">What is your name</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich heiße" data-rate="0.7"><span class="de" lang="de">Ich heiße ...</span><span class="en">My name is ...</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Woher kommst du" data-rate="0.7"><span class="de" lang="de">Woher kommst du ?</span><span class="en">Where are you from ?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich komme aus" data-rate="0.7"><span class="de" lang="de">Ich komme aus ...</span><span class="en">I am from ... (Eygpt)</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Wo wohnst du" data-rate="0.7"><span class="de" lang="de">Wo wohnst du ? ...</span><span class="en">Where do you live</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich wohne in" data-rate="0.7"><span class="de" lang="de">Ich wohne in ...</span><span class="en">I live in ... (Alex)</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Hallo" data-rate="0.7"><span class="de" lang="de">Hallo</span><span class="en">Hello</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Bitte" data-rate="0.7"><span class="de" lang="de">Bitte</span><span class="en">Please / you&#x27;re welcome</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Danke" data-rate="0.7"><span class="de" lang="de">Danke</span><span class="en">Thank you</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Vielen Dank" data-rate="0.7"><span class="de" lang="de">Vielen Dank</span><span class="en">Thank you very much</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Entschuldigung" data-rate="0.5"><span class="de" lang="de">Entschuldigung</span><span class="en">Exuse me / sorry</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Kein problem" data-rate="0.7"><span class="de" lang="de">Kein problem</span><span class="en">No problem</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ja" data-rate="0.7"><span class="de" lang="de">Ja</span><span class="en">Yes</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Nein" data-rate="0.7"><span class="de" lang="de">Nein</span><span class="en">No</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button></div><h2 class="sec">How are you?</h2><div class="grid cols-list"><button class="tile" type="button" data-say="Wie geht&#x27;s" data-rate="0.7"><span class="de" lang="de">Wie geht&#x27;s ?</span><span class="en">How are you?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Mir geht&#x27;s gut, danke" data-rate="0.7"><span class="de" lang="de">Mir geht&#x27;s gut, danke</span><span class="en">I&#x27;m fine, thank you</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Und dir" data-rate="0.7"><span class="de" lang="de">Und dir ?</span><span class="en">And you?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Nicht so gut" data-rate="0.7"><span class="de" lang="de">Nicht so gut</span><span class="en">Not so good</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Es geht" data-rate="0.7"><span class="de" lang="de">Es geht</span><span class="en">So-so / okay</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" dat prichst du Englisch ?</span><span class="en">Do you speak English?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Was ist das" data-rate="0.7"><span class="de" lang="de">Was ist das ?</span><span class="en">What is this?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button></div><h2 class="sec">Everyday life</h2><div class="grid cols-list"><button class="tile" type="button" data-say="Wie spät ist es" data-rate="0.7"><span class="de" lang="de">Wie spät ist es ?</span><span class="en">What time is it?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Wie alt bist du" data-rate="0.7"><span class="de" lang="de">Wie alt bist du ?</span><span class="en">How old are you?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich bin zwanzig Jahre alt" data-rate="0.7"><span class="de" lang="de">Ich bin zwanzig Jahre alt</span><span class="en">I am twenty years old</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich habe Hunger" data-rate="0.7"><span class="de" lang="de">Ich habe Hunger</span><span class="en">I am hungry</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich habe Durst" data-rate="0.7"><span class="de" lang="de">Ich habe Durst</span><span class="en">I am thirsty</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Ich möchte" data-rate="0.7"><span class="de" lang="de">Ich möchte ...</span><span class="en">I would like ...</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Wie viel kostet das" data-rate="0.7"><span class="de" lang="de">Wie viel kostet das ?</span><span class="en">How much is this?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Wo ist die Toilette" data-rate="0.7"><span class="de" lang="de">Wo ist die Toilette ?</span><span class="en">Where is the toilet?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Können Sie mir helfen" data-rate="0.7"><span class="de" lang="de">Können Sie mir helfen ?</span><span class="en">Can you help me?</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Natürlich" data-rate="0.7"><span class="de" lang="de">Natürlich</span><span class="en">Of course</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Bis später" data-rate="0.7"><span class="de" lang="de">Bis später</span><span class="en">See you later</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button><button class="tile" type="button" data-say="Bis morgen" data-rate="0.7"><span class="de" lang="de">Bis morgen</span><span class="en">See you tomorrow</span><i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></button></div><div class="pager"><a class="btn line" href="page2.html">Back to Verbs</a><a class="btn gold" href="about.html">About Mady</a></div></main>
